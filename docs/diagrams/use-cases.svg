<svg xmlns="http://www.w3.org/2000/svg" width="760" height="395" viewBox="0 0 760 395" role="img" aria-labelledby="title desc">
<title id="title">UML use cases for deployment support automation</title>
<desc id="desc">The DevOps operator starts a batch and reviews register outcomes. Google Sheets supports register updates, OpenProject supports work items, and custom APIs support channel and folder work.</desc>
