<text x="686" y="285" font-size="15" font-weight="650">OpenProject</text>
<circle cx="603" cy="326" r="6" fill="none" stroke="#334155" stroke-width="2"/>
<path d="M603 332v19m-13 -12h26m-13 12l-8 11m8 -11l8 11" fill="none" stroke="#334155" stroke-width="2"/>
